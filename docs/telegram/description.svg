<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- Bot description picture (bo'sh chatda "What can this bot do?" ustida). BotFather → Edit Description Picture. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset=".6" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx=".85" cy=".1" r=".7">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <circle cx="560" cy="300" r="140" fill="#ffffff" opacity=".05"/>
  <circle cx="600" cy="40" r="70" fill="#ffffff" opacity=".06"/>

  <!-- Logo -->
  <g transform="translate(48 52)">
    <rect width="72" height="72" rx="20" fill="#ffffff" opacity=".16"/>
    <g transform="translate(36 30) scale(.2)">
      <path d="M-150 0 L0 -64 L150 0 L0 64 Z" fill="#ffffff"/>
      <path d="M-92 26 V82 C-92 112 -48 132 0 132 C48 132 92 112 92 82 V26 L0 64 Z" fill="#ffffff" opacity=".9"/>
      <path d="M120 13 V92" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
      <circle cx="120" cy="100" r="18" fill="#fbbf24"/>
    </g>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" fill="#ffffff">
    <text x="138" y="84" font-size="38" font-weight="800" letter-spacing=".5">TISU Edu</text>
    <text x="139" y="112" font-size="17" font-weight="500" opacity=".85">O'quv markazi platformasi</text>
    <text x="48" y="178" font-size="25" font-weight="700">Kurslar, jadval va davomat —</text>
    <text x="48" y="210" font-size="25" font-weight="700">bitta Telegram botda.</text>
  </g>

  <!-- Imkoniyatlar -->
  <g font-family="Inter, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" fill="#ffffff">
    <g transform="translate(48 248)">
      <rect width="104" height="36" rx="18" fill="#ffffff" opacity=".16"/>
      <circle cx="20" cy="18" r="5" fill="#93c5fd"/><text x="32" y="23">Kurslar</text>
    </g>
    <g transform="translate(162 248)">
      <rect width="96" height="36" rx="18" fill="#ffffff" opacity=".16"/>
      <circle cx="20" cy="18" r="5" fill="#fde68a"/><text x="32" y="23">Jadval</text>
    </g>
    <g transform="translate(268 248)">
      <rect width="114" height="36" rx="18" fill="#ffffff" opacity=".16"/>
      <circle cx="20" cy="18" r="5" fill="#86efac"/><text x="32" y="23">Davomat</text>
    </g>
    <g transform="translate(48 294)">
      <rect width="98" height="36" rx="18" fill="#ffffff" opacity=".16"/>
      <circle cx="20" cy="18" r="5" fill="#f9a8d4"/><text x="32" y="23">Testlar</text>
    </g>
    <g transform="translate(156 294)">
      <rect width="128" height="36" rx="18" fill="#ffffff" opacity=".16"/>
      <circle cx="20" cy="18" r="5" fill="#c4b5fd"/><text x="32" y="23">Sertifikat</text>
    </g>
    <g transform="translate(294 294)">
      <rect width="112" height="36" rx="18" fill="#ffffff" opacity=".16"/>
      <circle cx="20" cy="18" r="5" fill="#fdba74"/><text x="32" y="23">Mini App</text>
    </g>
  </g>

  <!-- Telefon maketi -->
  <g transform="translate(452 70)">
    <rect width="140" height="250" rx="24" fill="#0f172a" opacity=".35"/>
    <rect x="8" y="8" width="124" height="234" rx="18" fill="#f1f5f9"/>
    <rect x="18" y="22" width="60" height="9" rx="4.5" fill="#1e293b"/>
    <rect x="18" y="38" width="38" height="6" rx="3" fill="#94a3b8"/>
    <g fill="#ffffff">
      <rect x="18" y="56" width="32" height="32" rx="8"/><rect x="54" y="56" width="32" height="32" rx="8"/><rect x="90" y="56" width="32" height="32" rx="8"/>
    </g>
    <circle cx="34" cy="72" r="7" fill="#3b82f6"/><circle cx="70" cy="72" r="7" fill="#f59e0b"/><circle cx="106" cy="72" r="7" fill="#22c55e"/>
    <rect x="18" y="100" width="104" height="54" rx="10" fill="#ffffff"/>
    <rect x="28" y="111" width="54" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="28" y="124" width="76" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="28" y="136" width="84" height="6" rx="3" fill="#e2e8f0"/><rect x="28" y="136" width="66" height="6" rx="3" fill="#22c55e"/>
    <rect x="18" y="162" width="104" height="34" rx="10" fill="#ffffff"/>
    <rect x="28" y="174" width="60" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="18" y="206" width="104" height="26" rx="9" fill="#2563eb"/>
    <rect x="48" y="216" width="44" height="6" rx="3" fill="#ffffff"/>
  </g>
</svg>
